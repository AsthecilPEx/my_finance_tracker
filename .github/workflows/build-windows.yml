name: Build Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist -- --publish never
      - name: Check the update files a release needs were built
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd release && ls -la
          for f in "PulseFinance-Setup-$VERSION.exe" "PulseFinance-Setup-$VERSION.exe.blockmap" "PulseFinance-Portable-$VERSION.exe" latest.yml; do
            [ -f "$f" ] || { echo "::error::Missing $f"; exit 1; }
          done
          cat latest.yml
      - name: Type into every input on every screen (real Windows)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: PulseFinance-Windows
          path: |
            release/*.exe
          if-no-files-found: error
